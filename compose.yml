services:

  postgres:
    image: postgres:17
    container_name: pilates-saas-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: pilates_saas
      POSTGRES_USER: pilates
      POSTGRES_PASSWORD: pilates_dev_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: