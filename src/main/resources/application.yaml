spring:
  application:
    name: pilates-saas

  datasource:
    url: jdbc:postgresql://localhost:5432/pilates_saas
    username: pilates
    password: pilates_dev_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    open-in-view: false

    properties:
      hibernate:
        format_sql: true

  thymeleaf:
    cache: false